[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snake-game"
version = "0.1.0"
description = "A classic Snake game implemented in Python using Pygame, supporting multiplayer."
readme = "README.md"
requires-python = ">=3.13,<3.14"
keywords = ["game", "snake", "pygame", "python", "multiplayer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Arcade",
]
license = { text = "MIT" }
dependencies = ["pygame>=2.6.1"]
authors = [{ name = "Carlos Valente", email = "cfmvcarlos@gmail.com" }]

[dependency-groups]
dev = [
    "basedpyright>=1.28.0",
    "pydoclint>=0.6.0",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.0",
    "ty>=0.0.86",
]

[tool.hatch.build.targets.wheel]
packages = ["src/snake_game"]

[tool.ruff]
line-length = 88
preview = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["CPY", "FIX", "TD", "COM812", "ISC001", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "INP001", "SLF001", "ANN", "D"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportInvalidTypeArguments = false

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra -q -n auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage]
run.branch = true
run.relative_files = true
report.fail_under = 90
report.show_missing = true
report.skip_covered = true
report.sort = "cover"

[tool.pydoclint]
exclude = ".git|.tox|.venv|build|dist|.uv-cache|.ruff_cache"
skip-checking-short-docstrings = false
check-style-mismatch = true
check-arg-defaults = true
show-filenames-in-every-violation-message = true
check-class-attributes = false
